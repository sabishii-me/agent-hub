[package]
name = "agent-hub-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rand = "0.9"
keyring = { workspace = true }
thiserror.workspace = true
tracing.workspace = true

# The REAL OS credential store per platform. WITHOUT a platform feature keyring
# silently falls back to an IN-PROCESS MOCK (its own docs: "the crate will use the
# (platform-independent) mock credential store"), so a credential write "succeeds"
# and is gone the moment the process ends. That is exactly a silent, non-persisted
# credential - the hub must never ship that. windows-native = Credential Manager;
# apple-native = the macOS keychain.
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }
